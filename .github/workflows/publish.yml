name: Pubblica il sito ParMA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Refresh HAL, missing translations and the seminar calendar every morning, in UTC.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Genera e controlla il sito
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7
      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/translation-requirements.txt
      - name: Conserva i modelli di traduzione
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: parma-translation-models-${{ runner.os }}-${{ hashFiles('tools/update_translations.py', 'tools/translation-requirements.txt') }}
          restore-keys: |
            parma-translation-models-${{ runner.os }}-
      - name: Installa la traduzione gratuita su CPU
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/translation-requirements.txt
      - name: Aggiorna le pubblicazioni da HAL
        run: python tools/update_publications.py --allow-stale
      # English is the only editable source; translate new or changed text once.
      - name: Aggiorna francese e italiano
        run: |
          python tools/update_translations.py
          python tools/update_translations.py --check
      - name: Verifica calendario e contenuti generati
        run: python -m unittest discover -s tests
      - name: Genera le pagine
        run: python tools/build.py
      - name: Controlla pagine e collegamenti
        run: python tools/check.py
      # Save exactly the snapshots used to build this run, without a second HAL fetch.
      - name: Conserva i dati generati
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: generated-content
          path: |
            content/publications.json
            content/translations/fr.json
            content/translations/it.json
          if-no-files-found: error
          retention-days: 1
      - name: Prepara il sito per la pubblicazione
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Only trusted main-branch events may commit generated snapshots.
  save-publications:
    name: Salva pubblicazioni e traduzioni
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7
      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Recupera gli stessi dati usati dal sito
        uses: actions/download-artifact@v8
        with:
          name: generated-content
          path: content
      - name: Salva le traduzioni e la selezione HAL
        run: |
          python tools/update_translations.py --save-to-git
          python tools/update_publications.py --save-to-git
          git push origin HEAD:main

  deploy:
    name: Pubblica su GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, save-publications]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
