name: Pubblica il sito ParMA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Refresh publications and the seminar dates every morning, in UTC.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Genera e controlla il sito
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7
      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Aggiorna le pubblicazioni da HAL
        run: python tools/update_publications.py --allow-stale
      - name: Verifica calendario e contenuti generati
        run: python -m unittest discover -s tests
      - name: Genera le pagine
        run: python tools/build.py
      - name: Controlla pagine e collegamenti
        run: python tools/check.py
      - name: Prepara il sito per la pubblicazione
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Only trusted main-branch events can save publication data.
  save-publications:
    name: Salva i dati delle pubblicazioni
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7
      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Aggiorna e salva la selezione HAL
        run: |
          python tools/update_publications.py --allow-stale
          python tools/update_publications.py --save-to-git

  deploy:
    name: Pubblica su GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, save-publications]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
