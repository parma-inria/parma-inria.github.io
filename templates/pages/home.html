<div class="home-grid">
  <section class="home-copy" aria-labelledby="about-title">
    <p class="eyebrow">$about_eyebrow</p>
    <h2 id="about-title" class="section-heading">$about_title</h2>
$introduction
  </section>
  <aside class="home-visual">
    <img class="parma-logo" src="${prefix}assets/images/parma-logo.png" width="1024" height="437" alt="$logo_alt">
    <p>$logo_caption</p>
  </aside>
</div>

<section aria-labelledby="research-title">
  <h2 id="research-title" class="section-heading">$research_title</h2>
  <div class="feature-grid">
$research_cards
  </div>
</section>

<section class="home-seminar" aria-labelledby="seminar-title">
  <div>
    <p class="eyebrow">$seminar_eyebrow</p>
    <h2 id="seminar-title" class="section-heading">$seminar_title</h2>
    <p>$seminar_description</p>
    <a class="small-link" href="${prefix}francais-gdt-edp-ot-ml/">$seminar_link_label <span aria-hidden="true">→</span></a>
  </div>
  <article class="info-card">
$next_session_date
    <h3>$next_session_title</h3>
$next_session_talks
  </article>
</section>
