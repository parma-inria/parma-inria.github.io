<div class="intro-callout">
  <p>$introduction</p>
</div>
<div class="info-grid">
  <section class="info-card" aria-labelledby="seminar-organizers">
    <h2 class="section-heading" id="seminar-organizers">$organizers_label</h2>
    <ul class="organizer-list">
$organizers
    </ul>
    <p><em>$mailing_list_note</em></p>
  </section>
  <section class="info-card" aria-labelledby="seminar-location">
    <h2 class="section-heading" id="seminar-location">$location_label</h2>
    <p>
      <a href="$venue_url" target="_blank" rel="noopener noreferrer">$venue_name</a>, Building $building. $room_label <strong>$room</strong>.
    </p>
  </section>
</div>

<section aria-labelledby="seminar-next">
  <h2 class="section-heading" id="seminar-next">$next_session_label</h2>
$next_sessions
</section>

<section aria-labelledby="seminar-schedule">
  <h2 class="section-heading" id="seminar-schedule">$schedule_label</h2>
  <div class="table-wrap">
    <table class="schedule-table" aria-label="$schedule_description">
      <tbody>
$calendar_rows
      </tbody>
    </table>
  </div>
</section>

<section aria-labelledby="seminar-history">
  <h2 class="section-heading" id="seminar-history">$history_label</h2>
$archive_years
</section>
